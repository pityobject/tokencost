name: ci

# 说明：
#   · 本仓库同时托管在 GitHub（本文件生效）与 Gitee（用 scripts/ci.ps1 本地跑）。
#   · 两边**必须同为 9 步**，否则"绿勾"的含义在两端不同。
#   · v10 复核指出：lint 原来带 continue-on-error（硬闸门形同虚设），
#     且 guardrails 不在远程 CI。现在两边跑同一组 9 步，任何一步非零即失败。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<3" "pandas>=2.0,<3" "scipy>=1.10,<2" \
                      "matplotlib>=3.7,<4" "httpx>=0.24,<1" "psutil>=5.9,<7"

      - name: (1) regenerate claim table
        working-directory: code
        run: python tc_claims.py

      - name: (2) docs must match artifacts
        working-directory: code
        run: python tc_claims.py --check

      - name: (3) core unit tests
        run: python tests/test_core.py

      - name: (4) guardrail tests
        run: python tests/test_guardrails.py

      # v10 复核 P0-1：这里**不再** continue-on-error。
      # 覆盖率 / 表格编号 / 过期论断 / 裸覆盖率四道硬 gate 都在这个脚本里。
      - name: (5) doc lint (hard gate)
        working-directory: code
        run: python tc_lint_docs.py

      - name: (6) project audit
        working-directory: code
        run: python tc_audit.py --fast

      - name: (7) calibration pipeline selftest (synthetic, no GPU)
        run: python code/tc_profile.py --selftest

      - name: (8) calculator site is in sync
        run: |
          python code/tc_web.py
          git diff --exit-code -- site/index.html

      - name: (9) data dictionary is in sync
        run: |
          python code/tc_docs_data.py
          git diff --exit-code -- 报告/数据字典.md
