name: ci

# 说明：
#   · 本仓库同时托管在 GitHub（本文件生效）与 Gitee（用 scripts/ci.ps1 本地跑）。
#   · 两边**必须同为 5 步**，否则"绿勾"的含义在两端不同。
#
# 五步与 scripts/ci.ps1 一一对应：
#   ① tc_claims.py          生成对外数字表
#   ② tc_claims.py --check  文档与产物对账（漂移即失败）
#   ③ tests/test_core.py    三个零依赖单元测试
#   ④ tc_lint_docs.py       "已作废数字"扫描（warning 级，不阻断）
#   ⑤ tc_audit.py --fast    全项目体检（CI 跳过裸克隆以控时）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib httpx psutil

      - name: Generate claim table and verify docs match artifacts
        working-directory: code
        run: |
          python tc_claims.py
          python tc_claims.py --check

      - name: Unit tests
        run: python tests/test_core.py

      # 与 scripts/ci.ps1 的第 4、5 步保持一致：
      # 本地 5 步、CI 也必须 5 步，否则"绿勾"的含义在两端不同（第七轮复核指出）。
      - name: Doc number lint (warning only)
        working-directory: code
        continue-on-error: true
        run: python tc_lint_docs.py

      - name: Project audit (skip bare-clone in CI for runtime)
        working-directory: code
        run: python tc_audit.py --fast
